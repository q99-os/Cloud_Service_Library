# Dev/debug container: `docker compose up -d`, then attach VS Code
# (Dev Containers: Attach to Running Container). Source is bind-mounted,
# so edits on the host are live inside the container.
services:
  cloud_services:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./cloud_services:/code/cloud_services
      - ./tests:/code/tests
      - ./pyproject.toml:/code/pyproject.toml
      - ./uv.lock:/code/uv.lock
    stdin_open: true
    tty: true
    environment:
      - AWS_KEY=aws_key
      - AWS_SECRET=aws_secret
      - AWS_REGION=us-east-1
