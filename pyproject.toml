[project]
name = "cloud_services"
version = "0.3.0"
description = "Library to connect to different cloud services"
authors = [{ name = "Q99" }]
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.39",
    "azure-storage-blob==12.30.0",
    "google-cloud-storage==3.12.0",
]

[tool.uv]
# Supply-chain quarantine: reject packages published less than 7 days ago
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "moto[s3]==5.2.2",
    "pip-audit==2.10.1",
    "bandit==1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloud_services"]
